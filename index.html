<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tended — a quiet place for your day</title>
  <meta name="description" content="Tended is a simple, beautiful todo list. A quiet place for your day." />
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23f59e0b'/><stop offset='1' stop-color='%23c2410c'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><path d='M8.5 17l4.5 4.5 7-8.5' stroke='white' stroke-width='2.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M18.5 13.5C18.5 8.5 21.5 5.5 26.5 5.5c0 5-3 8-8 8z' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
  </div>

  <header class="brand">
    <a class="brand-link" href="/" aria-label="Tended home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="brand-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="var(--accent-2)" />
            <stop offset="1" stop-color="var(--accent)" />
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="9" fill="url(#brand-grad)" />
        <path class="stem" d="M8.5 17l4.5 4.5 7-8.5" />
        <path class="leaf" d="M18.5 13.5C18.5 8.5 21.5 5.5 26.5 5.5c0 5-3 8-8 8z" />
      </svg>
      <span class="brand-name">Tended</span>
    </a>
    <span class="brand-tag">A quiet place for your day</span>
  </header>

  <main class="sheet">
    <header class="masthead">
      <div class="greeting">
        <p class="eyebrow" id="date"></p>
        <h1><span id="greeting">Hello</span><span class="dot">.</span></h1>
        <p class="lede" id="lede"></p>
      </div>
      <div class="ring" aria-hidden="true">
        <svg viewBox="0 0 80 80">
          <defs>
            <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="var(--accent-2)" />
              <stop offset="1" stop-color="var(--accent)" />
            </linearGradient>
          </defs>
          <circle class="track" cx="40" cy="40" r="34" />
          <circle class="bar" id="progress-bar" cx="40" cy="40" r="34" />
        </svg>
        <div class="ring-label">
          <strong id="progress-label">0%</strong>
          <span>done</span>
        </div>
      </div>
    </header>

    <dl class="stats">
      <div class="stat"><dt>Total</dt><dd id="stat-total">0</dd></div>
      <div class="stat"><dt>Active</dt><dd id="stat-active">0</dd></div>
      <div class="stat"><dt>Urgent</dt><dd id="stat-high">0</dd></div>
    </dl>

    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-row">
        <label for="new-todo" class="sr-only">New task</label>
        <input id="new-todo" name="title" type="text" placeholder="What needs doing?" maxlength="200" />
        <button type="submit" class="add" aria-label="Add task">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
      </div>
      <fieldset class="priority">
        <legend>Priority</legend>
        <label class="chip" data-priority="low"><input type="radio" name="priority" value="low" /><span>Low</span></label>
        <label class="chip" data-priority="normal"><input type="radio" name="priority" value="normal" checked /><span>Normal</span></label>
        <label class="chip" data-priority="high"><input type="radio" name="priority" value="high" /><span>High</span></label>
      </fieldset>
    </form>

    <div class="toolbar">
      <nav class="filters" id="filters" aria-label="Filter tasks">
        <span class="pill" id="pill" aria-hidden="true"></span>
        <button type="button" data-filter="all" aria-pressed="true">All <span class="badge" data-count="all">0</span></button>
        <button type="button" data-filter="active" aria-pressed="false">Active <span class="badge" data-count="active">0</span></button>
        <button type="button" data-filter="completed" aria-pressed="false">Done <span class="badge" data-count="completed">0</span></button>
      </nav>
      <button type="button" class="clear" id="clear-completed">Clear done</button>
    </div>

    <ul class="list" id="list" aria-live="polite"></ul>

    <div class="empty" id="empty" hidden>
      <svg class="empty-art" viewBox="0 0 120 96" aria-hidden="true">
        <rect x="22" y="14" width="76" height="72" rx="12" class="paper" />
        <rect x="34" y="32" width="10" height="10" rx="3" class="tick" />
        <rect x="50" y="34" width="36" height="6" rx="3" class="line" />
        <rect x="34" y="50" width="10" height="10" rx="3" class="tick" />
        <rect x="50" y="52" width="28" height="6" rx="3" class="line" />
        <rect x="34" y="68" width="10" height="10" rx="3" class="tick" />
        <rect x="50" y="70" width="32" height="6" rx="3" class="line" />
        <circle cx="96" cy="18" r="10" class="sun" />
      </svg>
      <p class="empty-title" id="empty-title">A clear page.</p>
      <p class="empty-sub" id="empty-sub">Add your first task above. Press <kbd>/</kbd> to jump there.</p>
    </div>
  </main>

  <p class="hint">Double-click a task to edit · <kbd>Enter</kbd> saves · <kbd>Esc</kbd> cancels</p>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <template id="todo-template">
    <li class="item">
      <label class="check">
        <input type="checkbox" />
        <span class="box" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        </span>
      </label>
      <div class="body">
        <span class="title"></span>
        <span class="meta"><span class="tag"></span><span class="when"></span></span>
      </div>
      <button type="button" class="delete" aria-label="Delete task">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" /></svg>
      </button>
    </li>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
